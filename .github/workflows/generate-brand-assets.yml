name: Generate Halaty showcase assets

on:
  push:
    branches:
      - main
    paths:
      - 'assets/branding/brand-mark.svg'
      - '.github/workflows/generate-brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: pip install cairosvg

      - name: Render high-resolution showcase assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          svg = Path('assets/branding/brand-mark.svg').read_bytes()
          out = Path('assets/branding')
          out.mkdir(parents=True, exist_ok=True)

          cairosvg.svg2png(
              bytestring=svg,
              write_to=str(out / 'brand-mark.png'),
              output_width=1024,
              output_height=1024,
          )
          cairosvg.svg2png(
              bytestring=svg,
              write_to=str(out / 'app-icon.png'),
              output_width=1024,
              output_height=1024,
              background_color='#FFFFFF',
          )
          PY

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/branding/brand-mark.png assets/branding/app-icon.png
          if git diff --cached --quiet; then
            echo 'Brand assets already up to date.'
          else
            git commit -m 'Generate high-resolution حالتي showcase assets'
            git push
          fi
